# The public name (JOCO_SERVER_NAME, set by entrypoint.sh). One site answers whatever name it's reached by.
ServerName ${JOCO_SERVER_NAME}
<VirtualHost *:80>
    ServerName ${JOCO_SERVER_NAME}
    # One login for SVN, the season catalog, and the mentor page.
    <Location />
        AuthType Basic
        # The project's original name, kept: add-ins recognize a team server by it.
        AuthName "JOCO ROBOS CAD"
        AuthUserFile /etc/joco/users
        Require valid-user
    </Location>
    # A public front page (what this server is, for people and web filters); everything else needs a sign-in.
    DocumentRoot /var/www/joco
    DirectoryIndex index.html
    <Directory /var/www/joco>
        Options None
        AllowOverride None
    </Directory>
    <LocationMatch "^/(index\.html|robots\.txt|logo\.png|icon\.png)?$">
        Require all granted
    </LocationMatch>
    <Location /svn>
        DAV svn
        SVNParentPath /var/lib/svn
        SVNListParentPath Off
        # Generated by joco.py: archived seasons are read-only.
        AuthzSVNAccessFile /etc/joco/authz
    </Location>
    # Which seasons exist and which one students open; read by the add-in.
    Alias /catalog.json /etc/joco/public/catalog.json
    # Published student installers, offered by the add-in.
    Alias /updates/ /etc/joco/public/updates/
    <Directory /etc/joco/public>
        Options None
        AllowOverride None
    </Directory>
    # First-time account setup with a mentor's one-time code: the only page reachable without signing in.
    <Location /account>
        Require all granted
        RequestHeader unset X-Joco-User early
        ProxyPass http://127.0.0.1:8092/account
        ProxyPassReverse http://127.0.0.1:8092/account
    </Location>
    <Location /admin>
        # The admin service trusts only this header, and only Apache can reach it.
        RequestHeader unset X-Joco-User early
        RequestHeader set X-Joco-User "expr=%{REMOTE_USER}"
        ProxyPass http://127.0.0.1:8092/admin
        ProxyPassReverse http://127.0.0.1:8092/admin
    </Location>
    ErrorLog /proc/self/fd/2
    # The visitor's real address (Cloudflare passes it on); the tunnel's own address would hide which network a request came from.
    LogFormat "%{CF-Connecting-IP}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" joco
    CustomLog /proc/self/fd/1 joco
</VirtualHost>
